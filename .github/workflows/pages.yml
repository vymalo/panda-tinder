name: Deploy to GitHub Pages

# Lint, type-check, test and build, then publish the build output. Every step
# runs before anything is published, so a broken commit is never deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scoped to what the Pages deployment needs, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and format (Biome)
        run: npm run lint
      - name: Type-check (TypeScript)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (SWC + Tailwind)
        run: npm run build
      - name: Upload the build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
